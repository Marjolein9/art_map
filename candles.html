<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Candle</title>
  <style>
    :root {
      --flame-height: 100px;
      --shadow-height: 40px;
      --wick-height: 50px;
      --candle-count: 5;
      --color-orange: #ff6a00;
      --color-orange-yellow: #ff9224;
      --color-dark: #2c2b39;
      --color-blue-dark: #30537d;
      --color-blue-light: #76daff;
      --color-yellow: #fbf348;
      --color-yellow-grey: #58523a;
    }

    body {
      background: #eae7e7;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      margin: 0;
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #candle-container {
      display: flex;
      gap: 50px;
      align-items: flex-end;
      padding-bottom: 50px;
    }

    .candle {
      width: 34px;
      position: relative;
      height: 80vh;
      max-height: 600px;
      animation: blink 0.1s infinite;
    }

    .candle.no-flame {
      animation: none;
    }

    /* Wick wrapper */
    .wick-wrapper {
      position: absolute;
      top: -35px;
      left: 50%;
      transform: translateX(-50%);
      width: 45px;
      height: 160px;
      pointer-events: none;
      z-index: 20;
    }

    .wick-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .wick-svg svg {
      width: 100%;
      height: 100%;
    }

    /* Flame */
    .flame {
      width: 20px;
      height: var(--flame-height);
      margin: 0 auto;
      position: relative;
      animation: move 3s infinite, move-left 3s infinite;
      transform-origin: 50% 90%;
    }

    .flame .top {
      width: 20px;
      height: 100%;
      position: absolute;
      top: 0; left: 0;
      background: white;
      border-top-left-radius: 500%;
      border-bottom-left-radius: 50px;
      border-top-right-radius: 500%;
      border-bottom-right-radius: 50px;
      transform: skewY(-10deg);
      box-shadow:
        0 0 0 3px white,
        0 -15px 1px 4px white,
        0 -18px 2px 3px gold,
        0 -22px 5px 4px var(--color-orange),
        0 0 100px 10px var(--color-orange),
        0 -10px 2px 4px white,
        0 -5px 3px 3px white;
      animation: flame-up 4s infinite;
    }

    .flame .shadows {
      position: absolute;
      left: 50%;
      top: 0;
      width: 1px;
      height: var(--shadow-height);
      border-radius: 50%;
      box-shadow:
        0 3px 15px 10px gold,
        0 0 70px 15px var(--color-orange),
        0 10px 35px 10px var(--color-orange),
        5px 20px 5px 10px var(--color-orange),
        5px 35px 5px 10px var(--color-orange),
        0 50px 35px 20px black;
    }

    .flame .bottom {
      transform: scale(0.9);
      position: absolute;
      bottom: 6px;
      left: 9px;
      width: 1px;
      height: 8px;
      border-radius: 1%;
      background: var(--color-dark);
      box-shadow:
        0 6px 10px 12px rgba(60, 76, 125, 0.3),
        0 0 4px 8px var(--color-dark),
        0 -12px 10px 8px rgba(255, 106, 0, 0.5),
        0 5px 7px 12px var(--color-dark),
        0 -3px 10px 12px var(--color-dark),
        5px -10px 10px 5px red,
        0 -15px 10px 10px gold,
        5px -25px 10px 5px gold,
        0 2px 5px 10px var(--color-blue-dark),
        0 -2px 2px 14px var(--color-blue-light),
        0 2px 10px 12px var(--color-blue-light);
    }

    /* Animations */
    @keyframes move {
      0% { transform: skewX(2deg) skewY(5deg); }
      50% { transform: skewX(-2deg) skewY(0deg); }
      100% { transform: skewX(2deg) skewY(5deg); }
    }

    @keyframes move-left {
      50% { transform: skewX(3deg); }
    }

    @keyframes flame-up {
      50% {
        box-shadow:
          0 0 0 3px white,
          0 -25px 1px 2px white,
          0 -28px 2px 3px gold,
          0 -35px 5px 4px var(--color-orange),
          0 0 100px 10px var(--color-orange),
          0 -10px 2px 4px white,
          0 -5px 3px 3px white;
      }
    }

    @keyframes blink {
      90% { opacity: 0.95; }
    }
  </style>
</head>

<body>
  <div id="candle-container"></div>

  <script>
    const config = {
      candleCount: null,
      minCandles: 3,
      maxCandles: 8,
      flameProbability: 0.7,
      gap: 50
    };

    const candleCount = config.candleCount !== null
      ? config.candleCount
      : Math.floor(Math.random() * (config.maxCandles - config.minCandles + 1)) + config.minCandles;

    document.documentElement.style.setProperty('--candle-count', candleCount);
    const container = document.getElementById('candle-container');
    container.style.gap = `${config.gap}px`;

    for (let i = 0; i < candleCount; i++) {
      const hasFlame = Math.random() < config.flameProbability;

      const candle = document.createElement('div');
      candle.className = hasFlame ? 'candle' : 'candle no-flame';

      if (hasFlame) {
        candle.innerHTML = `
          <div class="flame">
            <div class="shadows"></div>
            <div class="top"></div>
            <div class="middle"></div>
            <div class="bottom"></div>
          </div>
        `;
      } else {
        candle.innerHTML = `
<path id="wick" class="st51" d="M50.1,360.2c0,0,3.1-5.6,0-25.4c0,0-1.7-4.9,6.3-11.8c0,0,4.9,0,2.4,3.8c-2.4,3.8,0.7,2.1-1,5.6
	s-2.4,5.2-0.3,14.3c2.1,9,0,1.7,0,1.7s2.1,3.1,1,12.5C58.4,360.9,56.7,365.5,50.1,360.2z"></path>
        `;
      }

      container.appendChild(candle);
    }
  </script>
</body>
</html>
