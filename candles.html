<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Candle</title>
  <style>
    :root {
      --flame-height: 100px;
      --shadow-height: 40px;
      --wick-height: 50px;
      --candle-count: 5;
      --color-orange: #ff6a00;
      --color-orange-yellow: #ff9224;
      --color-dark: #2c2b39;
      --color-blue-dark: #30537d;
      --color-blue-light: #76daff;
      --color-yellow: #fbf348;
      --color-yellow-grey: #58523a;
    }

    body {
      background: #eae7e7;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      margin: 0;
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #candle-container {
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      align-items: flex-end;
      padding-bottom: 50px;
      max-width: calc(5 * (34px + 25px));
    }

    .candle {
      width: 34px;
      position: relative;
      height: 150px;
    }

    .candle.no-flame {
      animation: none;
    }

    /* Wick wrapper */
    .wick-wrapper {
      position: absolute;
      top: -35px;
      left: 50%;
      transform: translateX(-50%);
      width: 45px;
      height: 160px;
      pointer-events: none;
      z-index: 20;
    }

    .wick-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .wick-svg svg {
      width: 100%;
      height: 100%;
    }

    /* Flame */
    .flame {
      width: 20px;
      height: var(--flame-height);
      margin: 0 auto;
      position: relative;
      transform-origin: 50% 90%;
    }

    .flame-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform: scale(0.5);
      transform-origin: 50% 100%;
    }

    .flame-inner.small {
      transform: scale(0.25);
      transform-origin: 50% 100%;
    }

    .flame .top {
      width: 20px;
      height: 100%;
      position: absolute;
      top: 0; left: 0;
      background: white;
      border-top-left-radius: 500%;
      border-bottom-left-radius: 50px;
      border-top-right-radius: 500%;
      border-bottom-right-radius: 50px;
      transform: skewY(-10deg);
      box-shadow:
        0 0 0 3px white,
        0 -15px 1px 4px white,
        0 -18px 2px 3px gold,
        0 -22px 5px 4px var(--color-orange),
        0 0 100px 10px var(--color-orange),
        0 -10px 2px 4px white,
        0 -5px 3px 3px white;
    }

    .flame .shadows {
      position: absolute;
      left: 50%;
      top: 0;
      width: 1px;
      height: var(--shadow-height);
      border-radius: 50%;
      box-shadow:
        0 3px 15px 10px gold,
        0 0 70px 15px var(--color-orange),
        0 10px 35px 10px var(--color-orange),
        5px 20px 5px 10px var(--color-orange),
        5px 35px 5px 10px var(--color-orange),
        0 50px 35px 20px black;
    }

    .flame .bottom {
      transform: scale(0.9);
      position: absolute;
      bottom: 6px;
      left: 9px;
      width: 1px;
      height: 8px;
      border-radius: 1%;
      background: var(--color-dark);
      box-shadow:
        0 6px 10px 12px rgba(60, 76, 125, 0.3),
        0 0 4px 8px var(--color-dark),
        0 -12px 10px 8px rgba(255, 106, 0, 0.5),
        0 5px 7px 12px var(--color-dark),
        0 -3px 10px 12px var(--color-dark),
        5px -10px 10px 5px red,
        0 -15px 10px 10px gold,
        5px -25px 10px 5px gold,
        0 2px 5px 10px var(--color-blue-dark),
        0 -2px 2px 14px var(--color-blue-light),
        0 2px 10px 12px var(--color-blue-light);
    }

    /* Animations */
    @keyframes move {
      0% { transform: skewX(2deg) skewY(5deg); }
      50% { transform: skewX(-2deg) skewY(0deg); }
      100% { transform: skewX(2deg) skewY(5deg); }
    }

    @keyframes move-left {
      50% { transform: skewX(3deg); }
    }

    @keyframes flame-up {
      50% {
        box-shadow:
          0 0 0 3px white,
          0 -25px 1px 2px white,
          0 -28px 2px 3px gold,
          0 -35px 5px 4px var(--color-orange),
          0 0 100px 10px var(--color-orange),
          0 -10px 2px 4px white,
          0 -5px 3px 3px white;
      }
    }

    @keyframes blink {
      90% { opacity: 0.95; }
    }
  </style>
</head>

<body>
  <div id="candle-container"></div>

  <script>
    const config = {
      candleCount: null,
      minCandles: 3,
      maxCandles: 8,
      flameProbability: 0.7,
      gap: 25
    };

    const randomNum = Math.round((Math.random() * (config.maxCandles - config.minCandles) + config.minCandles) * 20) / 20;
    const fullCandles = Math.floor(randomNum);
    const lastCandleScale = randomNum - fullCandles;
    const candleCount = fullCandles + 1;

    document.documentElement.style.setProperty('--candle-count', candleCount);
    const container = document.getElementById('candle-container');
    container.style.gap = `${config.gap}px`;

    for (let i = 0; i < candleCount; i++) {
      const candle = document.createElement('div');
      candle.className = 'candle';
      candle.style.zIndex = candleCount - i;

      const isLast = i === candleCount - 1;
      let innerStyle = '';

      if (isLast && lastCandleScale > 0) {
        const scaledSize = lastCandleScale * 0.5;
        innerStyle = ` style="transform: scale(${scaledSize}); transform-origin: 50% 100%;"`;
      }

      candle.innerHTML = `
        <div class="flame">
          <div class="flame-inner"${innerStyle}>
            <div class="shadows"></div>
            <div class="top"></div>
            <div class="middle"></div>
            <div class="bottom"></div>
          </div>
        </div>
      `;

      container.appendChild(candle);
    }
  </script>
</body>
</html>
