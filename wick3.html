<!DOCTYPE html>
<html lang="en">
<head>

<title>Wick With Subtle Red Glow</title>

<style>

  position: absolute;
  inset: 0;

.st51 { fill: url(#wick_1_); }

<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">

<!-- Glow with slight shadow effect -->
<ellipse cx="55.5" cy="327" rx="8" ry="10" fill="url(#emberGlow)" filter="url(#tipShadow)"/>

<filter id="tipShadow" x="-50%" y="-50%" width="200%" height="200%">
