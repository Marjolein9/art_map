<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curly Smoke CSS</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #eae7e7;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #smoke-container {
      position: relative;
      width: 600px;
      height: 600px;
      display: block;
    }

    #wick {
      position: absolute;
      width: 600px;
      height: 600px;
      top: 0;
      left: 0;
      z-index: 10;
      pointer-events: none;
    }

    .smoke-particle {
      position: absolute;
      background: rgba(128, 128, 128, 0.5);
      border-radius: 50%;
      pointer-events: none;
      will-change: transform, opacity;
    }

    #controls {
      margin-top: 20px;
      text-align: center;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      background: #666;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #888;
    }
  </style>
</head>
<body>
  <div id="smoke-container">
    <img id="wick" />
  </div>

  <div id="controls">
    <button id="randomize-btn">Randomize</button>
  </div>

  <script>
    const container = document.getElementById('smoke-container');
    const cw = 600, cx = cw / 2;
    const ch = 600, cy = ch / 2;
    const rad = (Math.PI / 180);
    const r = 50;

    let frames = 0;
    let particles = [];

    // Randomization seeds
    let spacingVariation = Math.random() * 0.5 + 0.75;
    let direction = Math.random() > 0.5 ? 1 : -1;
    let spiralTightness = Math.random() * 4 + 4;
    let speed = Math.random() * 1 + 0.5;

    // Create wick SVG as data URL
    const wickSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
      <radialGradient id="emberGlow" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="rgba(255,70,50,0.25)"/>
        <stop offset="1" stop-color="rgba(255,70,50,0)"/>
      </radialGradient>
      <ellipse cx="55.5" cy="327" rx="8" ry="10" fill="url(#emberGlow)"/>
      <filter id="tipShadow" x="-50%" y="-50%" width="200%" height="200%">
        <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="rgba(0,0,0,0.25)"/>
      </filter>
      <linearGradient id="wick_1_" x1="54.703" y1="362.7598" x2="54.703" y2="323" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#C69C6D"/>
        <stop offset="0.038" stop-color="#A6825B"/>
        <stop offset="0.121" stop-color="#54422E"/>
        <stop offset="0.201" stop-color="#000"/>
        <stop offset="0.58" stop-color="#000"/>
        <stop offset="0.684" stop-color="#ED1C24" stop-opacity="0.5"/>
        <stop offset="0.818" stop-color="#F67E33" stop-opacity="0.95"/>
        <stop offset="1" stop-color="#FBB03B"/>
      </linearGradient>
      <radialGradient id="tip1_1_" cx="57.7" cy="325.46" r="2.4">
        <stop offset="0.20" stop-color="#000"/>
        <stop offset="0.63" stop-color="#000"/>
        <stop offset="0.73" stop-color="#ED1C24" stop-opacity="0.5"/>
        <stop offset="0.93" stop-color="#F67E33" stop-opacity="0.95"/>
        <stop offset="1" stop-color="#FBB03B" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="tip2_1_" cx="55.25" cy="329.97" r="2.64">
        <stop offset="0.20" stop-color="#000"/>
        <stop offset="0.63" stop-color="#000"/>
        <stop offset="0.73" stop-color="#ED1C24" stop-opacity="0.5"/>
        <stop offset="0.93" stop-color="#F67E33" stop-opacity="0.95"/>
        <stop offset="1" stop-color="#FBB03B"/>
      </radialGradient>
      <radialGradient id="tip3_1_" cx="171.25" cy="286.30" r="2.16" gradientTransform="matrix(0 1 -1 0 342.48 161.07)">
        <stop offset="0.20" stop-color="#000"/>
        <stop offset="0.71" stop-color="#000"/>
        <stop offset="0.82" stop-color="#ED1C24" stop-opacity="0.5"/>
        <stop offset="0.93" stop-color="#F67E33" stop-opacity="0.95"/>
        <stop offset="1" stop-color="#FBB03B" stop-opacity="0.2"/>
      </radialGradient>
      <path d="M50.1,360.2c0,0,3.1-5.6,0-25.4c0,0-1.7-4.9,6.3-11.8c0,0,4.9,0,2.4,3.8c-2.4,3.8,0.7,2.1-1,5.6s-2.4,5.2-0.3,14.3c2.1,9,0,1.7,0,1.7s2.1,3.1,1,12.5C58.4,360.9,56.7,365.5,50.1,360.2z"/>
      <path fill="url(#wick_1_)" d="M50.1,360.2c0,0,3.1-5.6,0-25.4c0,0-1.7-4.9,6.3-11.8c0,0,4.9,0,2.4,3.8c-2.4,3.8,0.7,2.1-1,5.6s-2.4,5.2-0.3,14.3c2.1,9,0,1.7,0,1.7s2.1,3.1,1,12.5C58.4,360.9,56.7,365.5,50.1,360.2z"/>
      <path fill="url(#tip1_1_)" d="M55.5,323.2c0,0-1.1,5.9,1.9,4.5C60.4,326.2,62.1,322.1,55.5,323.2z"/>
      <path fill="url(#tip2_1_)" d="M52.9,327.5c0,0-1.2,6.5,2.1,4.9C58.2,330.8,60.1,326.3,52.9,327.5z"/>
      <path fill="url(#tip3_1_)" d="M58.2,330.3c0,0-5.4-1-4,1.7C55.5,334.8,59.2,336.3,58.2,330.3z"/>
    </svg>`;

    document.getElementById('wick').src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(wickSvg);

    // Create smoke particles
    function createParticles() {
      // Clear existing particles
      particles.forEach(p => p.element.remove());
      particles = [];

      for (let i = -240; i < 180; i += 0.5) {
        const progress = (i + 240) / 420;
        const sizeMultiplier = progress;

        const t = i * rad * spacingVariation;
        const size = 5 * sizeMultiplier;

        if (size < 0.5) continue; // Skip very small particles

        const particle = document.createElement('div');
        particle.className = 'smoke-particle';
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';

        container.appendChild(particle);

        particles.push({
          element: particle,
          i: i,
          t: t,
          sizeMultiplier: sizeMultiplier,
          size: size
        });
      }
    }

    // Update particle positions
    function updateParticles() {
      frames += 1;
      const angle = frames * rad * speed;

      particles.forEach(particle => {
        const { i, t, sizeMultiplier, size } = particle;

        const z = 50 * t;
        const baseX = r * t * sizeMultiplier * Math.cos(spiralTightness * t - angle);
        const baseY = 0.5 * r * t * sizeMultiplier * Math.sin(spiralTightness * t - angle) * Math.sin(i * rad) - z;

        const x = cx + direction * baseX;
        const y = cy + baseY;

        // Calculate opacity based on position and size
        const opacity = Math.min(0.5, sizeMultiplier * 0.5);

        particle.element.style.transform = `translate(${x - size/2}px, ${y - size/2}px)`;
        particle.element.style.opacity = opacity;
      });

      requestAnimationFrame(updateParticles);
    }

    // Randomize button
    document.getElementById('randomize-btn').onclick = function() {
      spacingVariation = Math.random() * 0.5 + 0.75;
      direction = Math.random() > 0.5 ? 1 : -1;
      spiralTightness = Math.random() * 4 + 4;
      speed = Math.random() * 1 + 0.5;
      frames = 0;
      createParticles();
    };

    // Initialize
    createParticles();
    updateParticles();
  </script>
</body>
</html>
