<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curly Smoke</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #eae7e7;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #controls {
      margin-top: 20px;
      text-align: center;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      background: #666;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #888;
    }
  </style>
</head>
<body>
  <script>
    var c = document.createElement("canvas");
    c.style.display="block";
    c.style.margin = "0 auto";
    var ctx = c.getContext("2d");

    var cw = c.width = 600,
      cx = cw / 2;
    var ch = c.height = 600,
      cy = ch / 2;
    var frames = 0;
    var rad = (Math.PI / 180);
    var r=50, x, y, z, a = 0;
    ctx.lineWidth = .5;

    // Randomization seeds
    var spacingVariation = Math.random() * 0.5 + 0.75; // 0.75 to 1.25
    var direction = Math.random() > 0.5 ? 1 : -1; // Random direction
    var spiralTightness = Math.random() * 4 + 4; // 4 to 8
    var speed = Math.random() * 1 + 0.5; // 0.5 to 1.5

    document.body.appendChild(c);

    // Add controls
    var controlsDiv = document.createElement("div");
    controlsDiv.id = "controls";
    var button = document.createElement("button");
    button.textContent = "Randomize";
    button.onclick = function() {
      spacingVariation = Math.random() * 0.5 + 0.75;
      direction = Math.random() > 0.5 ? 1 : -1;
      spiralTightness = Math.random() * 4 + 4;
    };
    controlsDiv.appendChild(button);
    document.body.appendChild(controlsDiv);

    function Draw() {
      frames += 1;
      var angle = frames * rad;
      ctx.clearRect(0, 0, cw, ch);
      for (var i = -240; i < 180; i += .5) {
        // Calculate size - starts from a point (0), grows larger
        var progress = (i + 240) / 420;
        var sizeMultiplier = progress;

        // Debug: log first few values
        if (frames === 1 && i >= -240 && i <= -238) {
          console.log('i:', i, 'progress:', progress, 'sizeMultiplier:', sizeMultiplier);
        }

        ctx.strokeStyle = "hsla(" + (180+i) + ",75%,75%,.5)";
        var t = i * rad * spacingVariation;
        var z = 50 * t;
        var baseX = r*t * sizeMultiplier * Math.cos(spiralTightness * t - angle);
        var baseY = .5*r *t * sizeMultiplier * Math.sin(spiralTightness * t - angle) * Math.sin(i * rad) - z;
        x = cx + direction * baseX;
        y = cy + baseY;
        drawBezier(x, y, t, sizeMultiplier);
      }
      requestId = window.requestAnimationFrame(Draw);
    }
    requestId = window.requestAnimationFrame(Draw);

    function drawBezier(x0, y0, t, sizeMultiplier) {
      var size = 50 * sizeMultiplier;
      var x1 = x0 - size * Math.cos(t - 20 * rad);
      var y1 = y0 - size * Math.sin(t - 20 * rad);
      var x2 = x0 + size * Math.cos(t + 20 * rad);
      var y2 = y0 + size * Math.sin(t + 20 * rad);
      var x3 = x0 + (size * 2) * Math.cos(t);
      var y3 = y0 + (size * 2) * Math.cos(t);
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.bezierCurveTo(x1, y1, x2, y2, x3, y3);
      ctx.stroke();
    }
  </script>
</body>
</html>
