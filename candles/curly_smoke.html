<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curly Smoke</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #eae7e7;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #controls {
      margin-top: 20px;
      text-align: center;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      background: #666;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #888;
    }
  </style>
</head>
<body>
  <script>
    var c = document.createElement("canvas");
    c.style.display="block";
    c.style.margin = "0 auto";
    var ctx = c.getContext("2d");

    var cw = c.width = 600,
      cx = cw / 2;
    var ch = c.height = 600,
      cy = ch / 2;
    var frames = 0;
    var rad = (Math.PI / 180);
    var r=50, x, y, z, a = 0;
    ctx.lineWidth = .5;

    // Randomization seeds
    var spacingVariation = Math.random() * 0.5 + 0.75; // 0.75 to 1.25
    var direction = Math.random() > 0.5 ? 1 : -1; // Random direction
    var spiralTightness = Math.random() * 4 + 4; // 4 to 8
    var speed = Math.random() * 1 + 0.5; // 0.5 to 1.5

    document.body.appendChild(c);

    // Add controls
    var controlsDiv = document.createElement("div");
    controlsDiv.id = "controls";
    var button = document.createElement("button");
    button.textContent = "Randomize";
    button.onclick = function() {
      spacingVariation = Math.random() * 0.5 + 0.75;
      direction = Math.random() > 0.5 ? 1 : -1;
      spiralTightness = Math.random() * 4 + 4;
      speed = Math.random() * 1 + 0.5;
    };
    controlsDiv.appendChild(button);
    document.body.appendChild(controlsDiv);

    // Create wick SVG as data URL
    var wickSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
      <radialGradient id="emberGlow" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="rgba(255,70,50,0.25)"/>
        <stop offset="1" stop-color="rgba(255,70,50,0)"/>
      </radialGradient>
      <ellipse cx="55.5" cy="327" rx="8" ry="10" fill="url(#emberGlow)"/>
      <filter id="tipShadow" x="-50%" y="-50%" width="200%" height="200%">
        <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="rgba(0,0,0,0.25)"/>
      </filter>
      <linearGradient id="wick_1_" x1="54.703" y1="362.7598" x2="54.703" y2="323" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#C69C6D"/>
        <stop offset="0.038" stop-color="#A6825B"/>
        <stop offset="0.121" stop-color="#54422E"/>
        <stop offset="0.201" stop-color="#000"/>
        <stop offset="0.58" stop-color="#000"/>
        <stop offset="0.684" stop-color="#ED1C24" stop-opacity="0.5"/>
        <stop offset="0.818" stop-color="#F67E33" stop-opacity="0.95"/>
        <stop offset="1" stop-color="#FBB03B"/>
      </linearGradient>
      <radialGradient id="tip1_1_" cx="57.7" cy="325.46" r="2.4">
        <stop offset="0.20" stop-color="#000"/>
        <stop offset="0.63" stop-color="#000"/>
        <stop offset="0.73" stop-color="#ED1C24" stop-opacity="0.5"/>
        <stop offset="0.93" stop-color="#F67E33" stop-opacity="0.95"/>
        <stop offset="1" stop-color="#FBB03B" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="tip2_1_" cx="55.25" cy="329.97" r="2.64">
        <stop offset="0.20" stop-color="#000"/>
        <stop offset="0.63" stop-color="#000"/>
        <stop offset="0.73" stop-color="#ED1C24" stop-opacity="0.5"/>
        <stop offset="0.93" stop-color="#F67E33" stop-opacity="0.95"/>
        <stop offset="1" stop-color="#FBB03B"/>
      </radialGradient>
      <radialGradient id="tip3_1_" cx="171.25" cy="286.30" r="2.16" gradientTransform="matrix(0 1 -1 0 342.48 161.07)">
        <stop offset="0.20" stop-color="#000"/>
        <stop offset="0.71" stop-color="#000"/>
        <stop offset="0.82" stop-color="#ED1C24" stop-opacity="0.5"/>
        <stop offset="0.93" stop-color="#F67E33" stop-opacity="0.95"/>
        <stop offset="1" stop-color="#FBB03B" stop-opacity="0.2"/>
      </radialGradient>
      <path d="M50.1,360.2c0,0,3.1-5.6,0-25.4c0,0-1.7-4.9,6.3-11.8c0,0,4.9,0,2.4,3.8c-2.4,3.8,0.7,2.1-1,5.6s-2.4,5.2-0.3,14.3c2.1,9,0,1.7,0,1.7s2.1,3.1,1,12.5C58.4,360.9,56.7,365.5,50.1,360.2z"/>
      <path fill="url(#wick_1_)" d="M50.1,360.2c0,0,3.1-5.6,0-25.4c0,0-1.7-4.9,6.3-11.8c0,0,4.9,0,2.4,3.8c-2.4,3.8,0.7,2.1-1,5.6s-2.4,5.2-0.3,14.3c2.1,9,0,1.7,0,1.7s2.1,3.1,1,12.5C58.4,360.9,56.7,365.5,50.1,360.2z"/>
      <path fill="url(#tip1_1_)" d="M55.5,323.2c0,0-1.1,5.9,1.9,4.5C60.4,326.2,62.1,322.1,55.5,323.2z"/>
      <path fill="url(#tip2_1_)" d="M52.9,327.5c0,0-1.2,6.5,2.1,4.9C58.2,330.8,60.1,326.3,52.9,327.5z"/>
      <path fill="url(#tip3_1_)" d="M58.2,330.3c0,0-5.4-1-4,1.7C55.5,334.8,59.2,336.3,58.2,330.3z"/>
    </svg>`;

    var wickImg = new Image();
    var wickLoaded = false;
    wickImg.onload = function() {
      wickLoaded = true;
    };
    wickImg.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(wickSvg);

    function drawWick() {
      if (wickLoaded) {
        var wickScale = 1.5;
        var wickWidth = 400 * wickScale;
        var wickHeight = 400 * wickScale;
        var wickX = cx - wickWidth / 2;
        var wickY = cy - wickHeight / 2 + 220;
        ctx.drawImage(wickImg, wickX, wickY, wickWidth, wickHeight);
      } else {
        // Draw a placeholder until wick loads
        ctx.fillStyle = '#000';
        ctx.fillRect(cx - 5, cy + 200, 10, 80);
      }
    }

    function Draw() {
      frames += 1;
      var angle = frames * rad * speed;
      ctx.clearRect(0, 0, cw, ch);

      // Draw wick first
      drawWick();

      for (var i = -240; i < 180; i += .5) {
        // Calculate size - starts from a point (0), grows larger
        var progress = (i + 240) / 420;
        var sizeMultiplier = progress;

        // Debug: log first few values
        if (frames === 1 && i >= -240 && i <= -238) {
          console.log('i:', i, 'progress:', progress, 'sizeMultiplier:', sizeMultiplier);
        }

        ctx.strokeStyle = "hsla(0,0%,60%,.5)";
        var t = i * rad * spacingVariation;
        var z = 50 * t;
        var baseX = r*t * sizeMultiplier * Math.cos(spiralTightness * t - angle);
        var baseY = .5*r *t * sizeMultiplier * Math.sin(spiralTightness * t - angle) * Math.sin(i * rad) - z;
        x = cx + direction * baseX;
        y = cy + baseY;
        drawBezier(x, y, t, sizeMultiplier);
      }
      requestId = window.requestAnimationFrame(Draw);
    }
    requestId = window.requestAnimationFrame(Draw);

    function drawBezier(x0, y0, t, sizeMultiplier) {
      var size = 50 * sizeMultiplier;
      var x1 = x0 - size * Math.cos(t - 20 * rad);
      var y1 = y0 - size * Math.sin(t - 20 * rad);
      var x2 = x0 + size * Math.cos(t + 20 * rad);
      var y2 = y0 + size * Math.sin(t + 20 * rad);
      var x3 = x0 + (size * 2) * Math.cos(t);
      var y3 = y0 + (size * 2) * Math.cos(t);
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.bezierCurveTo(x1, y1, x2, y2, x3, y3);
      ctx.stroke();
    }
  </script>
</body>
</html>
