<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Candle</title>
  <style>
    :root {
      /* Candle configuration */
      --candle-width: 34px;
      --candle-height: var(--flame-height);
      --candle-gap: 50px;

      /* Flame configuration */
      --flame-height: 100px;
      --flame-width: 20px;
      --flame-bottom-offset: 6px;
      --shadow-height: 40px;

      /* Wick configuration */
      --wick-width: 20px;
      --wick-height: 60px;

      /* Colors */
      --color-orange: #ff6a00;
      --color-dark: #2c2b39;
      --color-blue-dark: #30537d;
      --color-blue-light: #76daff;
    }

    body {
      background: #1a1818;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      margin: 0;
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #candle-container {
      display: flex;
      gap: var(--candle-gap);
      align-items: flex-end;
      padding-bottom: 50px;
    }

    .candle {
      width: var(--candle-width);
      position: relative;
      height: var(--candle-height);
    }

    /* Wick */
    .wick {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: var(--wick-width);
      height: var(--wick-height);
      pointer-events: none;
      z-index: 1;
    }

    /* Flame */
    .flame {
      width: var(--flame-width);
      height: var(--flame-height);
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    .flame .top {
      width: var(--flame-width);
      height: 100%;
      position: absolute;
      top: 0; left: 0;
      background: white;
      border-top-left-radius: 500%;
      border-bottom-left-radius: 50px;
      border-top-right-radius: 500%;
      border-bottom-right-radius: 50px;
      transform: skewY(-10deg);
      box-shadow:
        0 0 0 3px white,
        0 -15px 1px 4px white,
        0 -18px 2px 3px gold,
        0 -22px 5px 4px var(--color-orange),
        0 0 100px 10px var(--color-orange),
        0 -10px 2px 4px white,
        0 -5px 3px 3px white;
    }

    .flame .shadows {
      position: absolute;
      left: 50%;
      top: 0;
      width: 1px;
      height: var(--shadow-height);
      border-radius: 50%;
      box-shadow:
        0 3px 15px 10px gold,
        0 0 70px 15px var(--color-orange),
        0 10px 35px 10px var(--color-orange),
        5px 20px 5px 10px var(--color-orange),
        5px 35px 5px 10px var(--color-orange),
        0 50px 35px 20px black;
    }

    .flame .bottom {
      transform: scale(0.9);
      position: absolute;
      bottom: var(--flame-bottom-offset);
      left: 9px;
      width: 1px;
      height: 8px;
      border-radius: 1%;
      background: var(--color-dark);
      box-shadow:
        0 6px 10px 12px rgba(60, 76, 125, 0.3),
        0 0 4px 8px var(--color-dark),
        0 -12px 10px 8px rgba(255, 106, 0, 0.5),
        0 5px 7px 12px var(--color-dark),
        0 -3px 10px 12px var(--color-dark),
        5px -10px 10px 5px red,
        0 -15px 10px 10px gold,
        5px -25px 10px 5px gold,
        0 2px 5px 10px var(--color-blue-dark),
        0 -2px 2px 14px var(--color-blue-light),
        0 2px 10px 12px var(--color-blue-light);
    }

  </style>
</head>

<body>
  <div id="candle-container"></div>

  <script>
    // CONFIGURATION - Easy to adjust
    const config = {
      // Number of candles
      flameCount: 5,    // Number of lit candles (with flames)
      wickCount: 3,     // Number of unlit candles (wicks only)

      // Candle dimensions (optional - defaults to CSS variables)
      candleWidth: null,    // e.g., '40px'
      candleHeight: null,   // e.g., '70vh'
      candleGap: null,      // e.g., '60px'

      // Flame dimensions (optional - defaults to CSS variables)
      flameHeight: null,    // e.g., '120px'
      flameWidth: null,     // e.g., '25px'

      // Wick dimensions (optional - defaults to CSS variables)
      wickHeight: null,     // e.g., '70px'
      wickWidth: null       // e.g., '25px'
    };

    // Apply configuration
    const container = document.getElementById('candle-container');
    const root = document.documentElement;

    // Apply custom dimensions if specified
    if (config.candleWidth) root.style.setProperty('--candle-width', config.candleWidth);
    if (config.candleHeight) root.style.setProperty('--candle-height', config.candleHeight);
    if (config.candleGap) root.style.setProperty('--candle-gap', config.candleGap);
    if (config.flameHeight) root.style.setProperty('--flame-height', config.flameHeight);
    if (config.flameWidth) root.style.setProperty('--flame-width', config.flameWidth);
    if (config.wickHeight) root.style.setProperty('--wick-height', config.wickHeight);
    if (config.wickWidth) root.style.setProperty('--wick-width', config.wickWidth);

    // Create array of candle types
    const candleTypes = [
      ...Array(config.flameCount).fill('flame'),
      ...Array(config.wickCount).fill('wick')
    ];

    // Shuffle array to randomize order
    for (let i = candleTypes.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [candleTypes[i], candleTypes[j]] = [candleTypes[j], candleTypes[i]];
    }

    // Create candles
    for (let i = 0; i < candleTypes.length; i++) {
      const hasFlame = candleTypes[i] === 'flame';

      const candle = document.createElement('div');
      candle.className = 'candle';

      if (hasFlame) {
        candle.innerHTML = `
          <div class="flame">
            <div class="shadows"></div>
            <div class="top"></div>
            <div class="bottom"></div>
          </div>
        `;
      } else {
        candle.innerHTML = `
          <img src="wick3.svg" class="wick">
        `;
      }

      container.appendChild(candle);
    }
  </script>
</body>
</html>
